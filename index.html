    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://dkbrxwudehntzlyhtsdb.supabase.co" />
    <!--
      Font dimuat via <link> (bukan @import di CSS): @import membuat
      CSS lokal menunggu CSS Google Fonts (rantai blocking serial) sebelum
      render dimulai. Tampilan font 100% sama.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
    />
